[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dm-securegate-cli"
version = "0.1.0"
description = "DM SecureGate static security baseline scanner (CWE-798/306/942/250/749/494)"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
securegate = "securegate.cli:main"
dm-secure = "securegate.cli:main"

[tool.setuptools]
packages = ["securegate"]
